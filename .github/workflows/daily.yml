name: Daily meeting data

on:
  schedule:
    # 11:23 UTC is about 4 AM in Oregon, before anyone's morning meeting.
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the small daily status file (keeps the schedule alive)
  pages: write
  id-token: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the builder
        run: python -m unittest discover -s tests -v
      - name: Build the data site
        env:
          # Sharing keys groups have given this project ("id=key;id2=key2"). Never committed.
          SOURCE_KEYS: ${{ secrets.SOURCE_KEYS }}
        run: python builder/build.py --out site --status status/latest.json
      - name: Record today's status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/latest.json
          git diff --cached --quiet || git commit -m "Daily status $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
